<title>{ger} Simulador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: faixa preta da {ger} com redes; coluna da esquerda alterna entre lista de posts e editor; à direita, o celular com a prévia ao vivo. */
:root{
  --ink:#111111; --yellow:#FFC800;
  --band:#111111; --band-fg:#f4f4f0; --band-muted:#a3a39b;
  --bg:#f4f4f1; --surface:#ffffff; --sunk:#ebebe6; --line:#dadad3;
  --fg:#141414; --muted:#5e5e57; --brand-text:#7a5c00; --brand-soft:#fff3c4;
  --ok:#2c7a4b; --warn:#9a5b06; --bad:#b0332a; --info:#2d5b94;
  --ok-soft:#e0f0e5; --warn-soft:#fbe9cf; --bad-soft:#f7dfdc; --info-soft:#dfe8f4;
  --font:"Proxima Nova","proxima-nova",Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --band:#000000; --band-fg:#f4f4f0; --band-muted:#8e8e86;
  --bg:#0d0d0d; --surface:#171717; --sunk:#202020; --line:#2e2e2e;
  --fg:#f0f0ec; --muted:#a0a098; --brand-text:#FFC800; --brand-soft:#2e2608;
  --ok:#72c690; --warn:#e8a94f; --bad:#ee8579; --info:#8ab2e6;
  --ok-soft:#18301f; --warn-soft:#382811; --bad-soft:#3b1d1a; --info-soft:#18273a; color-scheme:dark}}
:root[data-theme="dark"]{
  --band:#000000; --band-fg:#f4f4f0; --band-muted:#8e8e86;
  --bg:#0d0d0d; --surface:#171717; --sunk:#202020; --line:#2e2e2e;
  --fg:#f0f0ec; --muted:#a0a098; --brand-text:#FFC800; --brand-soft:#2e2608;
  --ok:#72c690; --warn:#e8a94f; --bad:#ee8579; --info:#8ab2e6;
  --ok-soft:#18301f; --warn-soft:#382811; --bad-soft:#3b1d1a; --info-soft:#18273a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--band);color:var(--band-fg)}
.hbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:14px 10px}
.brand{font-weight:800;font-size:24px;line-height:1;letter-spacing:-.02em;color:var(--yellow)}
.brand small{font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--band-fg);margin-left:8px}
.grow{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px}
nav button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--band-muted);cursor:pointer;white-space:nowrap;font-weight:600}
nav button:hover{color:var(--band-fg)}
nav button[aria-selected="true"]{background:var(--yellow);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--fg)}
a.btn{text-decoration:none;color:var(--fg);display:inline-flex;align-items:center}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.outline{background:transparent;border-color:#444;color:var(--band-fg)}
.btn.outline:hover{border-color:var(--band-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn.sm{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
h2{font-weight:800;font-size:20px;line-height:1.2;margin:0;letter-spacing:-.01em}
h3{font-weight:700;font-size:12px;line-height:1.3;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 10px}
.sub{color:var(--muted);font-size:14px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--info-soft);margin:16px 0 0;font-size:14px}
.notice.bad{background:var(--bad-soft)}
.pfsel{background:#222;border:1px solid #444;color:var(--band-fg);border-radius:999px;padding:7px 12px;font-weight:600;max-width:200px}
main{padding-block:20px 56px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:start}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.side{scroll-margin-top:140px;display:flex;flex-direction:column;gap:16px;min-width:0}
/* perfil */
.pcard{display:flex;gap:14px;align-items:center}
.pcard .av{width:56px;height:56px}
.pcard .nm{font-weight:800;font-size:17px;line-height:1.2}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--sunk);color:var(--fg);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.brand{background:var(--brand-soft);color:var(--brand-text)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--yellow);border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}}
/* lista de posts */
.plist{display:flex;flex-direction:column}
.prow{display:flex;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:8px}
.pgroup{border-top:1px solid var(--line);padding-top:6px;margin-top:4px}.pgroup:first-child{border-top:0;margin-top:0;padding-top:0}
.pgl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px 2px}
.pgroup .prow{border-top:0}
.handle{flex:none;width:22px;align-self:stretch;display:grid;place-items:center;font-size:18px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;border-radius:6px}
.handle:hover{background:var(--sunk);color:var(--fg)}
.prow.drag{position:relative;z-index:5;background:var(--surface);box-shadow:0 8px 20px rgb(0 0 0/.18);cursor:grabbing;transition:none}
.prow.gap-t{box-shadow:inset 0 3px 0 var(--yellow)}
.prow.gap-b{box-shadow:inset 0 -3px 0 var(--yellow)}
.prow:hover{background:var(--sunk)}
.prow.sel{background:var(--brand-soft)}
.thumb{width:52px;height:52px;border-radius:8px;overflow:hidden;background:var(--sunk);flex:none;display:grid;place-items:center;color:var(--muted);position:relative}
.thumb img,.thumb video{width:100%;height:100%;object-fit:cover;display:block}
.thumb .badge{position:absolute;right:3px;top:3px;color:#fff;filter:drop-shadow(0 1px 2px rgb(0 0 0/.6))}
.rname{font-weight:700;font-size:14px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname.untitled{color:var(--muted);font-weight:600;font-style:italic}
.rsub{font-size:13px;color:var(--muted);line-height:1.35}
.empty{color:var(--muted);font-size:14px;padding:18px 4px;text-align:center}
/* editor */
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fields .full{grid-column:1/-1}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.fields .sec{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
@media (max-width:480px){.fields{grid-template-columns:minmax(0,1fr)}}
input,select,textarea{background:var(--sunk);border:1px solid transparent;border-radius:8px;padding:9px 11px;font-size:14px;color:var(--fg);font-weight:500;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--yellow);background:var(--surface)}
textarea{min-height:120px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:auto}
input[type=range]{padding:0;background:none}
.ckrow{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;color:var(--fg)!important}
.help{font-size:12px;color:var(--muted);font-weight:500}
.counters{display:flex;gap:6px;flex-wrap:wrap}
.cnt{font:500 12px/1.4 var(--mono);padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.cnt.over{background:var(--bad-soft);color:var(--bad)}
.warns{display:flex;flex-direction:column;gap:6px}
.warn{font-size:13px;padding:8px 11px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);font-size:14px;font-weight:600;background:var(--bg)}
.drop:hover,.drop.over{border-color:var(--yellow);color:var(--fg);background:var(--brand-soft)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.mitem{position:relative;border-radius:8px;overflow:hidden;background:var(--sunk);aspect-ratio:4/5}
.mitem img,.mitem video{width:100%;height:100%;object-fit:cover;display:block}
.mitem .n{position:absolute;left:5px;top:5px;background:rgb(0 0 0/.65);color:#fff;font:600 11px/1 var(--mono);padding:3px 5px;border-radius:5px}
.mitem .mb{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:4px;background:linear-gradient(transparent,rgb(0 0 0/.6))}
.mitem .mb button{border:0;background:rgb(255 255 255/.92);color:#111;border-radius:6px;width:24px;height:24px;cursor:pointer;font-weight:800;display:grid;place-items:center;padding:0}
.mitem.up{display:grid;place-items:center;font-size:12px;color:var(--muted);font-weight:600}
.sticky-acts{position:sticky;bottom:0;background:var(--surface);padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.preview-cut{font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;white-space:pre-wrap;color:var(--fg)}
.preview-cut i{color:var(--muted);font-style:normal}
/* palco */
.stage{width:412px;display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:120px}
@media (max-width:980px){.stage{position:static;width:100%;order:-1}.side{order:0}}
@media (max-width:700px){header{position:static}.pfsel{max-width:150px}}
.mobonly{display:none}@media (max-width:980px){.mobonly{display:inline-block}}
.vtabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap;justify-content:center}
.vtabs button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.vtabs button[aria-selected="true"]{background:var(--ink);color:var(--yellow)}
:root[data-theme="dark"] .vtabs button[aria-selected="true"]{background:var(--yellow);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .vtabs button[aria-selected="true"]{background:var(--yellow);color:var(--ink)}}
.toggles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tg{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.tg[aria-pressed="true"]{border-color:var(--fg);color:var(--fg);background:var(--sunk)}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;font-weight:700}
.prog{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--brand-soft);display:flex;flex-direction:column;gap:8px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.prog-bar{height:10px;border-radius:99px;background:var(--surface);overflow:hidden;border:1px solid var(--line)}
.prog-bar i{display:block;height:100%;width:0;background:var(--yellow);border-radius:99px;transition:width .9s ease}
.prog-steps{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.prog-steps .done{color:var(--fg)}
.prog-steps .on{color:var(--fg);font-weight:700}
.num{font-variant-numeric:tabular-nums;font-weight:700}
.st-poll{position:absolute;left:50%;transform:translate(-50%,-50%);width:74%;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgb(0 0 0/.28);z-index:6;color:#111;text-align:center;overflow:hidden}
.st-poll>b{display:block;padding:14px 14px 10px;font-size:16px;line-height:1.25;font-weight:700}
.st-poll .opts{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.st-poll .opts button{position:relative;overflow:hidden;background:#efefef!important;border-radius:10px;padding:10px 12px!important;font-weight:700!important;font-size:14px!important;display:flex;justify-content:space-between;align-items:center;color:#111!important}
.st-poll .opts button i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c7d2fe,#fbcfe8);z-index:0;transition:width .4s}
.st-poll .opts button span,.st-poll .opts button em{position:relative;z-index:1;font-style:normal}
.st-poll .opts.two{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0;border-top:1px solid #e6e6e6}
.st-poll .opts.two button{background:#fff!important;border-radius:0;padding:14px 6px!important;flex-direction:column;justify-content:center;gap:2px}
.st-poll .opts.two button+button{border-left:1px solid #e6e6e6}
.st-poll .opts.two button span{font-size:21px;font-weight:800;text-transform:uppercase;background:linear-gradient(90deg,#4f5bd5,#d62976,#fa7e1e);-webkit-background-clip:text;background-clip:text;color:transparent}
.st-poll .opts.two button em{font-size:13px;font-weight:700;color:#555}
.st-poll .opts button.me{outline:2px solid #d62976;outline-offset:-2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--yellow);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60}

/* ===== celular ===== */
.phone{--m-bg:#fff;--m-fg:#000;--m-muted:#737373;--m-line:#dbdbdb;--m-link:#00376b;--m-blue:#0095f6;--m-page:#fff;--m-card:#fff;--m-chip:#efefef;
  width:390px;max-width:100%;height:min(812px,calc(100vh - 230px));min-height:560px;border-radius:44px;border:11px solid #0b0b0b;box-shadow:0 0 0 1px #333,0 30px 60px -20px rgb(0 0 0/.35);
  background:var(--m-page);color:var(--m-fg);position:relative;overflow:hidden;font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;isolation:isolate}
@media (max-width:980px){.phone{height:760px}}
@media (max-width:440px){.phone{height:min(720px,calc(100svh - 150px));border-width:8px;border-radius:36px}}
.phone.dark{--m-bg:#000;--m-fg:#f5f5f5;--m-muted:#a8a8a8;--m-line:#262626;--m-link:#e0f1ff;--m-page:#000;--m-card:#000;--m-chip:#262626}
.phone.li{--m-page:#f4f2ee;--m-card:#fff;--m-muted:#666;--m-blue:#0a66c2;--m-line:#e8e8e8}
.phone.li.dark{--m-page:#000;--m-card:#1b1f23;--m-muted:#a6a6a6;--m-blue:#71b7fb;--m-line:#38434f}
.phone.fb{--m-page:#c9ccd1;--m-card:#fff;--m-muted:#65676b;--m-blue:#0866ff;--m-line:#e4e6eb;--m-chip:#f0f2f5}
.phone.fb.dark{--m-page:#000;--m-card:#242526;--m-muted:#b0b3b8;--m-blue:#2d88ff;--m-line:#3e4042;--m-chip:#3a3b3c}
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;background:var(--m-page)}
.scr::-webkit-scrollbar{display:none}
.phone *{box-sizing:border-box}
.phone button{background:none;border:0;padding:0;color:inherit;cursor:pointer;font:inherit}
.phone svg{display:block}
.sb{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 30px;font-weight:600;font-size:15px;position:sticky;top:0;z-index:6;background:var(--m-bg)}
.sb.ov{position:absolute;inset:0 0 auto;background:transparent;color:#fff;z-index:30}
.sb .sbi{display:flex;gap:5px;align-items:center}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:30px;border-radius:20px;background:#000;z-index:40;pointer-events:none}
.mbar{position:sticky;bottom:0;z-index:6;display:flex;justify-content:space-around;align-items:center;height:56px;padding-bottom:6px;background:var(--m-bg);border-top:1px solid var(--m-line)}
.mbar.abs{position:absolute;inset:auto 0 0 0}
.mbar .lbl{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--m-muted)}
.mbar .lbl.on{color:var(--m-fg)}
.av{border-radius:50%;overflow:hidden;background:var(--yellow);color:#111;display:grid;place-items:center;font-weight:800;flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.ring{padding:2px;border-radius:50%;background:conic-gradient(from 210deg,#f9ce34,#ee2a7b,#6228d7,#f9ce34);flex:none;display:grid;place-items:center}
.ring>.av{border:2px solid var(--m-bg)}
.ring.seen{background:var(--m-line)}
.verif{display:inline-block;vertical-align:-2px;margin-left:3px}
.tag{color:var(--m-link)}
.muted{color:var(--m-muted)}
.more{color:var(--m-muted);cursor:pointer}
.md{position:relative;overflow:hidden;background:#111;width:100%}
.md>img,.md>video,.slide>img,.slide>video{width:100%;height:100%;object-fit:cover;display:block}
.car{position:relative;width:100%;height:100%}
.car-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;height:100%;scrollbar-width:none}
.car-track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;height:100%;position:relative;background:#111}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:30px;height:30px;border-radius:50%;background:rgb(255 255 255/.9)!important;color:#111!important;display:grid!important;place-items:center;box-shadow:0 1px 4px rgb(0 0 0/.3)}
.car-btn[hidden]{display:none!important}
.car-btn.prev{left:10px}.car-btn.next{right:10px}
.car-btn:hover{background:#fff!important}
.car-track{cursor:grab;user-select:none}
.car-track.dragging{cursor:grabbing;scroll-snap-type:none}
.car-track img{-webkit-user-drag:none;pointer-events:none}
.car-n{position:absolute;top:12px;right:12px;background:rgb(18 18 18/.72);color:#fff;font-size:12px;font-weight:600;border-radius:12px;padding:3px 8px;z-index:2}
.dots{display:flex;gap:4px;justify-content:center;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--m-line)}
.dots i.on{background:var(--m-blue)}
.vbadge{position:absolute;bottom:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgb(0 0 0/.55);color:#fff;display:grid;place-items:center;z-index:2}
.nomedia{display:grid;place-items:center;height:100%;color:#888;font-size:13px;background:repeating-linear-gradient(45deg,#1d1d1d 0 12px,#232323 12px 24px);text-align:center;padding:20px}
.li-doc .statmark{top:44px}
.fsv .statmark{top:100px;left:14px}
.pinned{outline:3px solid var(--yellow);outline-offset:-3px}
.statmark{position:absolute;left:8px;top:8px;z-index:3;background:var(--yellow);color:#111;font:700 10.5px/1 var(--font);padding:4px 7px;border-radius:99px;letter-spacing:.02em}
/* Instagram */
.ig-top{display:flex;align-items:center;gap:18px;padding:4px 14px 8px;background:var(--m-bg);position:sticky;top:44px;z-index:5}
.ig-word{font-size:22px;font-weight:700;letter-spacing:-.02em;flex:1;display:flex;align-items:center;gap:4px}
.ig-tray{display:flex;gap:14px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none;border-bottom:1px solid var(--m-line);background:var(--m-bg)}
.ig-tray::-webkit-scrollbar{display:none}

const ETAPAS=[["pedido","Pedido",4],["lendo","Lendo posts",15],["midias","Imagens",40],["montando","Montando",65],["publicando","Publicando",82],["site","No ar",95]];
function progOf(sh){const t0=Date.parse(sh&&sh.pedidoEm)||Date.now(),el=(Date.now()-t0)/1000;
  let k=Math.max(0,ETAPAS.findIndex(e=>e[0]===(sh&&sh.etapa)));if(k<0)k=0;
  const floor=ETAPAS[k][2],ceil=k<ETAPAS.length-1?ETAPAS[k+1][2]-1:97;
  const est=Math.min(92,8+88*(1-Math.exp(-el/170)));
  return{pct:Math.round(Math.min(ceil,Math.max(floor,est))),k,el}}
function fmtEl(s){s=Math.max(0,Math.round(s));return s<60?s+" s":Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s"}
let progTimer=null;
function tickProg(){const el=$("#prog");const p=pf(),sh=shareOf(p&&p.id);
  if(!el||!sh||shareState(sh)!=="gerando"){clearInterval(progTimer);progTimer=null;return}
  const g=progOf(sh);$("#progFill").style.width=g.pct+"%";$("#progPct").textContent=g.pct+"%";
  $("#progLbl").textContent=(g.el>600?"Está demorando mais que o normal… ":"")+ETAPAS[g.k][1]+"…";
  el.querySelectorAll("[data-step]").forEach(x=>{const i=+x.dataset.step;x.className=i<g.k?"done":i===g.k?"on":""});
  $("#progTime").textContent=`${fmtEl(g.el)} até agora · costuma levar de 3 a 6 minutos. Pode fechar este painel; o link aparece aqui quando ficar pronto.`}

async function saveShare(){readShare();const p=pf(),d=edit.d,sh=shareOf(p.id);
  d.slug=slugify(d.slug||p.nome);if(!d.slug)return toast("Escolha o final do endereço.");
  if(shares.some(x=>x.id!==p.id&&x.slug===d.slug))return toast("Esse endereço já é de outro perfil. Escolha outro final.");
  const body={...(sh||{}),...d,perfil:p.id,perfilNome:p.nome||"",pedidoEm:new Date().toISOString(),status:"gerando",erro:""};delete body.id;
  try{await put("compartilhamentos",p.id,body)}catch(err){return failWrite(err)}
  edit.manual=false;
  let ok=false;try{const mcp=await claude.use("mcp");if(mcp&&!TRIG_ID.startsWith("__")){await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:TRIG_ID,text:"perfil="+p.id});ok=true}}catch(e){console.warn("fire_trigger",e&&e.code)}
  if(!ok){edit.manual=true;try{await upd("compartilhamentos",p.id,{status:"manual"})}catch(_){}}
  toast(ok?"Gerando o link…":"Pedido salvo");renderSide()}

function mediaGrid(d){const ms=d.midias||[];return ms.map((m,i)=>`<div class="mitem">${mEl(m)}<span class="n">${i+1}</span><div class="mb"><button type="button" data-mv="${i}:-1" aria-label="Mover para a esquerda"${i?"":" disabled"}>‹</button><button type="button" data-mx="${i}" aria-label="Remover">×</button><button type="button" data-mv="${i}:1" aria-label="Mover para a direita"${i<ms.length-1?"":" disabled"}>›</button></div></div>`).join("")+(uploading?`<div class="mitem up">Enviando ${uploading}…</div>`:"")}
function updCounters(){if(!edit||edit.kind!=="post")return;const d=edit.d,t=d.legenda||"";
  const c=$("#counters");if(c){const hs=(t.match(/#[\p{L}\p{N}_]+/gu)||[]).length;
    c.innerHTML=(d.redes||[]).map(r=>`<span class="cnt${t.length>NETS[r].lim?" over":""}">${NETS[r].n} ${t.length.toLocaleString("pt-BR")}/${NETS[r].lim.toLocaleString("pt-BR")}</span>`).join("")+(hs?`<span class="cnt${hs>30?" over":""}">${hs} hashtag${hs>1?"s":""}${hs>30?" (máx. 30 no Instagram)":""}</span>`:"")}
  const cp=$("#cutPrev");if(cp){const r=(d.redes||[]).includes("ig")?["Instagram",125,2]:(d.redes||[]).includes("li")?["LinkedIn",210,3]:null;
    if(r&&t){const x=cut(t,r[1],r[2]);cp.innerHTML=`<span class="help">O que aparece antes do "mais" no ${r[0]}:</span><div class="preview-cut">${esc(x.s)}${x.cut?"<i>… mais</i>":""}</div>`}else cp.innerHTML=""}
  const w=$("#warns");if(w)w.innerHTML=warns(d).map(x=>`<div class="warn">${esc(x)}</div>`).join("")}
function warns(d){const W=[],ms=d.midias||[],R=d.redes||[];
  R.forEach(r=>{if(!NETS[r].acc.includes(d.formato))W.push(`${NETS[r].n} não tem o formato "${FMT[d.formato][0]}". Ele não vai aparecer na prévia dessa rede.`)});
  if(!R.length)W.push("Escolha pelo menos uma rede.");
  if(d.formato==="carrossel"&&ms.length<2)W.push("Carrossel precisa de pelo menos 2 itens.");
  if(d.formato==="carrossel"&&ms.length>20)W.push("O Instagram aceita até 20 itens no carrossel.");
  if(d.formato==="reel"&&ms.length&&ms[0].t!=="video")W.push("Reel precisa de vídeo. Com imagem, a prévia mostra a imagem parada.");
  if((d.formato==="foto"||d.formato==="story")&&ms.length>1)W.push("Esse formato usa só o primeiro item. Para vários, escolha Carrossel.");
  if(d.formato==="story"&&ms[0]&&ms[0].w&&Math.abs(ms[0].w/ms[0].h-.5625)>.06)W.push("Story fica melhor em 9:16 (1080 × 1920). Esta mídia vai ser cortada nas bordas.");
  if(d.formato==="reel"&&ms[0]&&ms[0].w&&Math.abs(ms[0].w/ms[0].h-.5625)>.06)W.push("Reel e TikTok pedem vídeo vertical 9:16. Este vai aparecer com corte ou faixas.");
  if(!["texto","enquete","link"].includes(d.formato)&&!ms.length)W.push(d.formato==="artigo"?"Artigo sem capa: o card no feed fica só com o título.":d.formato==="evento"?"Evento sem capa: o LinkedIn usa um fundo padrão.":"Ainda sem mídia: a prévia mostra um espaço vazio.");
  if(d.formato==="enquete"&&(d.opcoes||[]).filter(x=>x&&x.trim()).length<2)W.push("A enquete precisa de pelo menos 2 opções.");
  if(d.formato==="artigo"&&!(d.artTitulo||"").trim())W.push("Dê um título ao artigo.");
  if(d.formato==="link"&&!(d.url||"").trim())W.push("Coloque o endereço do link.");
  return W}
function bindDrop(){const dz=$("#drop");if(!dz)return;

  dz.ondrop=e=>{e.preventDefault();dz.classList.remove("over");addFiles([...e.dataTransfer.files],"midias")}}

function renderPhone(){

let pendingFocus=false;
function carousel(p,key,items,ratioV,opts={}){const n=items.length;
  if(n<=1)return`<div class="md" style="aspect-ratio:${ratioV}">${mEl(items[0])}${items[0]&&items[0].t==="video"?`<span class="vbadge">${I(opt.muted?"mute":"vol",16)}</span>`:""}</div>`;
  return`<div class="md" style="aspect-ratio:${ratioV}"><div class="car" data-car="${esc(key)}" data-n="${n}"><div class="car-track">${items.map(m=>`<div class="slide">${mEl(m)}</div>`).join("")}</div>${opts.noCounter?"":`<span class="car-n">1/${n}</span>`}${carBtns()}</div></div>`}
const carBtns=()=>`<button type="button" class="car-btn prev" data-car-go="-1" aria-label="Imagem anterior" hidden>${I("back",16,2.6)}</button><button type="button" class="car-btn next" data-car-go="1" aria-label="Próxima imagem">${I("back",16,2.6,'style="transform:scaleX(-1)"')}</button>`;
function carUpd(t){const c=t.closest("[data-car]");if(!c)return;const n=+c.dataset.n,i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));
  const cn=c.querySelector(".car-n");if(cn)cn.textContent=`${i+1}/${n}`;
  const pv=c.querySelector(".car-btn.prev"),nx=c.querySelector(".car-btn.next");if(pv)pv.hidden=i<=0;if(nx)nx.hidden=i>=n-1;
  const vi=c.closest(".vitem");if(vi)vi.querySelectorAll(".ttdots i").forEach((d,j)=>d.classList.toggle("on",j===i));
  const art=c.closest("[data-pid]");if(art)art.querySelectorAll(".dots i").forEach((d,j)=>d.classList.toggle("on",j===i));
  const ld=art&&art.querySelector(".li-doc .pg");if(ld)ld.textContent=`${i+1} / ${n}`}
const dotsHTML=n=>n>1?`<span class="dots">${Array.from({length:Math.min(n,20)},(_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</span>`:"<span></span>";
function capBlock(p,key,t,maxC,maxL,lead,moreTxt){const ex=expanded.has(key);const x=ex?{s:t,cut:false}:cut(t,maxC,maxL);
  return`${lead||""}${capHTML(x.s)}${x.cut?`<button type="button" class="more" data-exp="${esc(key)}">${moreTxt||"… mais"}</button>`:""}`}

function fbMedia(x,ms){const n=ms.length;if(n===1)return`<div class="md" style="aspect-ratio:${ratio(x,"fb")}">${mEl(ms[0])}</div>`;

  if(n===2)return`<div class="fb-col" style="grid-template-columns:1fr 1fr;aspect-ratio:1">${c(ms[0])}${c(ms[1])}</div>`;
  if(n===3)return`<div class="fb-col" style="grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:1"><div class="c" style="grid-row:1/3">${mEl(ms[0])}</div>${c(ms[1])}${c(ms[2])}</div>`;

async function dims(blob,isV){const u=URL.createObjectURL(blob);try{if(isV){return await new Promise(r=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>r({w:v.videoWidth,h:v.videoHeight});v.onerror=()=>r({w:0,h:0});v.src=u})}
  return await new Promise(r=>{const im=new Image();im.onload=()=>r({w:im.naturalWidth,h:im.naturalHeight});im.onerror=()=>r({w:0,h:0});im.src=u})}finally{setTimeout(()=>URL.revokeObjectURL(u),2000)}}
async function shrink(file,w,h){const max=2160;if(file.type==="image/gif"||(Math.max(w,h)<=max&&file.size<4e6))return{blob:file,w,h};
  const s=Math.min(1,max/Math.max(w,h)),W=Math.round(w*s),H=Math.round(h*s);
  const bmp=await createImageBitmap(file);const c=document.createElement("canvas");c.width=W;c.height=H;c.getContext("2d").drawImage(bmp,0,0,W,H);
  const type=file.type==="image/png"?"image/webp":"image/jpeg";const blob=await new Promise(r=>c.toBlob(r,type,.9));return{blob:blob||file,w:W,h:H}}
async function prep(file){const isV=/^video\//.test(file.type);
  if(file.type==="video/quicktime"||/\.mov$/i.test(file.name))throw new Error("Vídeo .MOV não é aceito. Exporte em MP4.");
  if(!/^(image\/(png|jpeg|webp|gif)|video\/(mp4|webm))$/.test(file.type))throw new Error(`${file.name}: formato não aceito.`);
  let{w,h}=await dims(file,isV);let blob=file;if(!isV){const r=await shrink(file,w,h);blob=r.blob;w=r.w;h=r.h}
  if(blob.size>20*1024*1024)throw new Error(`${file.name} passa de 20 MB. Comprima antes de enviar.`);
  if(assets){const up=await assets.upload(blob,{type:blob.type||file.type});return{a:up.id,t:isV?"video":"img",w,h}}
  const k="L"+Math.random().toString(36).slice(2);localBlobs[k]=URL.createObjectURL(blob);return{k,t:isV?"video":"img",w,h}}
async function addFiles(files,target){if(!edit||!files.length)return;const ed=edit;
  if(target==="midias"&&["foto","reel","story"].includes(ed.d.formato)&&files.length>1){ed.d.formato="carrossel"}
  uploading+=files.length;if(ed.kind==="post")$("#mgrid")&&($("#mgrid").innerHTML=mediaGrid(ed.d));
  for(const f of files){try{const m=await prep(f);
      if(target==="capa")ed.d.capa=m;else if(target==="avatar"){if(m.a)ed.d.foto=m.a;else{ed.d.foto="";ed.d.fotoK=m.k}}
      else{if(["foto","reel","story","artigo","link","evento"].includes(ed.d.formato))ed.d.midias=[m];else ed.d.midias=[...(ed.d.midias||[]),m]}
    }catch(err){toast(err&&err.code==="too_large"?"Arquivo grande demais (máx. 20 MB).":err&&err.code==="quota_or_state"?"O espaço de mídia do simulador acabou. Exclua posts antigos.":err&&err.message&&!err.code?err.message:"Não deu para enviar "+f.name)}
    finally{uploading--}
    if(edit===ed){renderSide();schedPreview()}}
}

  if(act==="stprev")return stStep(-1);
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("[data-edit]"))e.target.click();if(e.key==="Escape"&&edit){edit=null;renderAll()}});
$("#side").addEventListener("input",e=>{if(!edit)return;if(edit.kind==="share")return;const el=e.target;if(!el.name)return;readForm();if(el.name==="legenda")updCounters();schedPreview()});
$("#side").addEventListener("change",e=>{if(!edit)return;if(edit.kind==="share"){readShare();if(["filtro","slug","perIni","perFim"].includes(e.target.name)){renderSide()}return}readForm();schedPreview()});
$("#scr").addEventListener("scroll",e=>{const t=e.target;if(t.classList&&t.classList.contains("car-track"))carUpd(t)},true);
$("#pfSel").onchange=e=>{cur=e.target.value;ls.set("sim-pf",cur);if(edit&&edit.kind==="post")edit=null;renderAll()};
$("#newPost").onclick=()=>newPost();
$("#newPf").onclick=()=>openPerfil(true);
function openPerfil(isNew){const p=isNew?{nome:"",usuario:"",seguidores:1000,seguindo:300}:JSON.parse(JSON.stringify(pf()));const id=isNew?newId("perfis"):p.id;delete p.id;edit={kind:"perfil",isNew,id,d:p};renderAll();toSide()}
// arrastar na grade
let dragId=null;
$("#scr").addEventListener("dragstart",e=>{const t=e.target.closest&&e.target.closest("[data-tile]");if(!t)return;dragId=t.dataset.tile;t.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",dragId)}catch(_){}});
$("#scr").addEventListener("dragover",e=>{const t=e.target.closest&&e.target.closest("[data-tile]");if(!t||!dragId)return;e.preventDefault();$$(".tile.over").forEach(x=>x.classList.remove("over"));t.classList.add("over")});
$("#scr").addEventListener("drop",e=>{const t=e.target.closest&&e.target.closest("[data-tile]");if(!t||!dragId)return;e.preventDefault();const d=dragId;dragId=null;reorder(d,t.dataset.tile)});
$("#scr").addEventListener("dragend",()=>{dragId=null;$$(".tile.over,.tile.dragging").forEach(x=>x.classList.remove("over","dragging"))});

/* arrastar o carrossel com o mouse e setas do teclado */
let carDrag=null,carDragMoved=false;
$("#scr").addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||e.button!==0)return;const tr=e.target.closest(".car-track");if(!tr||e.target.closest(".car-btn"))return;
  carDrag={tr,x:e.clientX,sl:tr.scrollLeft,moved:false};});
window.addEventListener("pointermove",e=>{if(!carDrag)return;const dx=e.clientX-carDrag.x;if(Math.abs(dx)>4&&!carDrag.moved){carDrag.moved=true;carDrag.tr.classList.add("dragging")}if(carDrag.moved){carDrag.tr.scrollLeft=carDrag.sl-dx;e.preventDefault()}});
window.addEventListener("pointerup",e=>{if(!carDrag)return;const{tr,moved,x,sl}=carDrag;carDrag=null;if(!moved)return;carDragMoved=true;setTimeout(()=>carDragMoved=false,50);
  const w=tr.clientWidth,dx=e.clientX-x;let i=Math.round(sl/w);if(dx<-w*.15)i++;else if(dx>w*.15)i--;i=Math.max(0,Math.min(i,tr.children.length-1));
  tr.scrollTo({left:i*w,behavior:"smooth"});setTimeout(()=>tr.classList.remove("dragging"),350)});
document.addEventListener("keydown",e=>{if(e.key!=="ArrowRight"&&e.key!=="ArrowLeft")return;if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName))return;
  const ph=$("#phone");if(!ph.matches(":hover"))return;if(isStoryView()){e.preventDefault();return stStep(e.key==="ArrowRight"?1:-1)}
  const r=ph.getBoundingClientRect();const tr=[...ph.querySelectorAll(".car-track")].find(t=>{const b=t.getBoundingClientRect();return b.top<r.bottom-80&&b.bottom>r.top+120});
  if(!tr)return;e.preventDefault();const i=Math.round(tr.scrollLeft/tr.clientWidth)+(e.key==="ArrowRight"?1:-1);tr.scrollTo({left:i*tr.clientWidth,behavior:"smooth"})});

/* ---------- início ---------- */
renderAll();
setStatus("Conectando ao banco do simulador…");
(async()=>{
  db=await claude.use("db");
  if(!db){localMode=true;setStatus("Modo de teste: esta visualização não conseguiu o banco. Dá para montar posts, mas nada fica salvo ao fechar. Abra a página logado no claude.ai para salvar.",true);
    perfis=[{id:"local",nome:"{ger}",usuario:"ger.consultoria",seguidores:1200,seguindo:350}];cur="local";renderAll();return}
  const user=await claude.use("user");
  if(user){try{const w=await user.can("data.write");if(w===false)canWrite=false}catch(_){}}
  assets=await claude.use("assets");
  let got={a:false,b:false};const timer=setTimeout(()=>{if(!got.a)setStatus("Os dados ainda não chegaram. Verifique a conexão; a página continua tentando.",true)},10000);
  const done=()=>{if(got.a&&got.b){clearTimeout(timer);setStatus(canWrite?"":"Você está vendo em modo leitura: pode navegar pelas prévias, mas não editar.")}};
  db.collection("perfis").onSnapshot(s=>{perfis=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.nome||"").localeCompare(b.nome||"","pt"));if(!perfis.some(p=>p.id===cur))cur=(perfis[0]||{}).id||"";if(!s.metadata.fromCache)got.a=true;done();if(edit)renderTop(),renderPhone();else renderAll()},()=>{clearTimeout(timer);setStatus("A conexão com o banco caiu. Recarregue a página.",true)});
  db.collection("compartilhamentos").onSnapshot(s=>{const prev=Object.fromEntries(shares.map(x=>[x.id,shareState(x)]));shares=s.docs.map(d=>({id:d.id,...d.data()}));shares.forEach(x=>{if(prev[x.id]==="gerando"&&shareState(x)==="pronto")toast("Link pronto: "+(x.perfilNome||""));if(prev[x.id]==="gerando"&&shareState(x)==="erro")toast("Não deu para gerar o link")});if(edit&&edit.kind==="share"){readShare();renderSide()}else if(!edit)renderSide()},()=>{});
  db.collection("posts").onSnapshot(s=>{posts=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.metadata.fromCache)got.b=true;done();if(edit)renderPhone();else renderAll()},()=>{});
})();
</script>
